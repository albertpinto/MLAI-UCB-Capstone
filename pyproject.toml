[project]
name = "capstone"
version = "0.1.0"
description = "Simple RAG: ingest support documents, search them semantically"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chonkie>=1.7.0",
    "docling>=2.145.0",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "networkx>=3.6.1",
    "openai>=3.42.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

# Standalone project: stops uv from joining the workspace in ~/Documents
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
eval = [
    "rank-bm25>=0.2.2",
]
notebook = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.0",
    "pypdf>=6.21.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Payload indexes have no effect"]
