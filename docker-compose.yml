services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: capstone-qdrant
    ports:
      - "6335:6333"   # host 6335 avoids a clash with other Qdrant containers on 6333
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    ulimits:
      nofile:  # each collection keeps many segment files open; the default limit ran out with a few collections
        soft: 65535
        hard: 65535

volumes:
  qdrant_data:
